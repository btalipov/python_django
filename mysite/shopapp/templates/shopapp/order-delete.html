{% extends "shopapp/base.html" %}

{% block title %}
    Delete order #{{ order.pk }}
{% endblock %}

{% block body %}
    <h1>Are you sure you want to delete order #{{ order.pk }}?</h1>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Delete</button>
    </form>

    <p><a href="{% url 'shopapp:order_details' pk=order.pk %}">Back to order</a></p>
{% endblock %}
