{% extends "shopapp/base.html" %}

{% block title %}
    Shop Index
{% endblock %}

{% block body %}
    <h1>{{ "hello shop index!"|title }}</h1>

    <ul>
        {% for name, url_name in links %}
            <li><a href="{% url url_name %}">{{ name }}</a></li>
        {% endfor %}
    </ul>

    <p>Time running: {{ time_running|floatformat:3 }}</p>
{% endblock %}
